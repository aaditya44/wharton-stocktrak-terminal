name: Quote publisher paused (data rights)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Publication paused pending data rights and private storage
        run: |
          echo '::warning::Scheduled raw Finnhub quote publication is paused. Personal-use terms do not authorize public redistribution. No quote fetch or public artifact upload. Daily model never consumed these snapshots.'
